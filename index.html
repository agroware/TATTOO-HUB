<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tattoo Hub — 3D Tattoo Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #eee; }

  #app { position: relative; width: 100vw; height: 100vh; }
  #canvas-wrap { position: absolute; inset: 0; }

  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1a1a20 0%, #0d0d0f 70%);
  }
  #gate.hidden { display: none; }
  #gateBox {
    width: 340px; padding: 36px 30px; border-radius: 18px;
    background: rgba(20,20,24,0.9); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 80px rgba(255,77,109,0.08);
  }
  #gateLogo {
    font-weight: 800; letter-spacing: 3px; font-size: 24px; margin-bottom: 6px;
    background: linear-gradient(90deg,#ff4d6d,#ff9a3c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #gateSub { font-size: 12px; color: #777; margin-bottom: 26px; letter-spacing: 1px; }
  #gateInput {
    width: 100%; padding: 13px 16px; border-radius: 10px; font-size: 16px;
    background: #121216; border: 1px solid rgba(255,255,255,0.1);
    color: #fff; outline: none; text-align: center; letter-spacing: 4px;
    transition: border-color 0.2s;
  }
  #gateInput:focus { border-color: #ff4d6d; }
  #gateBtn {
    width: 100%; margin-top: 14px; padding: 13px; border-radius: 10px;
    background: linear-gradient(135deg,#ff4d6d,#ff9a3c);
    color: #000; font-weight: 700; font-size: 14px; letter-spacing: 1px;
    border: none; cursor: pointer;
  }
  #gateErr { font-size: 12px; color: #ff4d6d; margin-top: 12px; height: 16px; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  #gateBox.shake { animation: shake 0.35s; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 10;
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  #logo {
    font-weight: 800; letter-spacing: 2px; font-size: 18px;
    background: linear-gradient(90deg,#ff4d6d,#ff9a3c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #topbar .actions { display: flex; gap: 8px; }

  #panel {
    position: absolute; top: 72px; left: 16px; width: 260px;
    background: rgba(20,20,24,0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 16px; z-index: 10;
    max-height: calc(100vh - 100px); overflow-y: auto;
  }
  #panel h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: #888; margin-bottom: 8px; font-weight: 600;
  }
  .group { margin-bottom: 18px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button.btn {
    background: #1e1e24; color: #eee; border: 1px solid rgba(255,255,255,0.1);
    padding: 8px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;
    transition: all 0.15s; font-weight: 500;
  }
  button.btn:hover { background: #2a2a32; border-color: rgba(255,255,255,0.2); }
  button.btn.active {
    background: linear-gradient(135deg,#ff4d6d,#ff9a3c); color: #000; border-color: transparent;
  }
  input[type="range"] { width: 100%; accent-color: #ff4d6d; }
  input[type="color"] {
    width: 100%; height: 34px; border: none; border-radius: 8px; background: #1e1e24; cursor: pointer;
  }
  label.small { font-size: 11px; color: #aaa; display: block; margin-bottom: 4px; }

  #drop {
    border: 2px dashed rgba(255,255,255,0.15); border-radius: 10px;
    padding: 18px 10px; text-align: center; font-size: 12px; color: #888;
    cursor: pointer; transition: all 0.2s;
  }
  #drop:hover, #drop.drag { border-color: #ff4d6d; color: #ff4d6d; background: rgba(255,77,109,0.05); }
  #fileInput { display: none; }

  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row span { font-size: 11px; color: #aaa; min-width: 34px; text-align: right; }

  #hint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #666; background: rgba(0,0,0,0.5);
    padding: 6px 14px; border-radius: 20px; z-index: 10; white-space: nowrap;
  }

  #toast {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(255,77,109,0.95); color: #fff; padding: 10px 18px;
    border-radius: 8px; font-size: 13px; z-index: 20; opacity: 0;
    transition: all 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  #loading {
    position: absolute; inset: 0; z-index: 5; display: flex;
    align-items: center; justify-content: center; pointer-events: none;

  #loading.hidden { display: none; }

  <div id="gateBox">
    <div id="gateLogo">TATTOO HUB</div>
    <div id="gateSub">ENTER ACCESS CODE</div>
    <input id="gateInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••" />
    <button id="gateBtn">UNLOCK</button>
    <div id="gateErr"></div>

</div>

<div id="app" style="visibility:hidden;">
  <div id="canvas-wrap"></div>

  <div id="topbar">
    <div id="logo">TATTOO HUB</div>
    <div class="actions">
      <button class="btn" id="resetView">Reset View</button>
      <button class="btn" id="snapshot">Snapshot</button>

  <div id="panel">
    <div class="group">

    <div class="group">

  <div id="hint">Drag to rotate • Scroll to zoom • Right-drag to pan</div>
  <div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';

/* ============================================================
   PASSWORD GATE
   ============================================================ */
const PASSWORD = '2026';
const gate = document.getElementById('gate');
const gateBox = document.getElementById('gateBox');
const gateInput = document.getElementById('gateInput');
const gateBtn = document.getElementById('gateBtn');
const gateErr = document.getElementById('gateErr');

function tryUnlock() {
  if (gateInput.value === PASSWORD) {
    sessionStorage.setItem('tattooHubUnlocked', '1');
    gate.classList.add('hidden');
    document.getElementById('app').style.visibility = 'visible';
    initScene();
  } else {
    gateErr.textContent = 'Incorrect code';
    gateBox.classList.add('shake');
    gateInput.value = '';
    setTimeout(() => gateBox.classList.remove('shake'), 400);
  }
}
gateBtn.addEventListener('click', tryUnlock);
gateInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

if (sessionStorage.getItem('tattooHubUnlocked') === '1') {
  gate.classList.add('hidden');
  document.getElementById('app').style.visibility = 'visible';
}

/* ============================================================
   SCENE
   ============================================================ */
let scene, camera, renderer, controls;
let skinMaterial, bodyGroup, ground;
let keyLight, hemi, fillLight, rimLight;
let tattooDecals = [];
let tattooImage = null;
let sceneReady = false;
let skinTextures = {};
let currentParams = { scale: 1, rotation: 0, opacity: 0.95, flipH: false };
let currentPart = 'fullArm';

function initScene() {
  if (sceneReady) return;
  sceneReady = true;

  const wrap = document.getElementById('canvas-wrap');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0d0f);

  camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0.6, 0.4, 3.4);

  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  wrap.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.0;
  controls.maxDistance = 10;
  controls.target.set(0, 0, 0);

  hemi = new THREE.HemisphereLight(0xffffff, 0x241a15, 0.5);
  scene.add(hemi);

  keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
  keyLight.position.set(2.5, 3.5, 3);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 25;
  keyLight.shadow.bias = -0.0005;
  scene.add(keyLight);

  fillLight = new THREE.DirectionalLight(0xffd9b3, 0.65);
  fillLight.position.set(-3, 1, -1.5);
  scene.add(fillLight);

  rimLight = new THREE.DirectionalLight(0x88aaff, 0.55);
  rimLight.position.set(-1, 2, -3);
  scene.add(rimLight);

  // Procedural skin textures (color, roughness, normal)
  skinTextures = buildSkinTextures();

  skinMaterial = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color('#e8b48c'),
    roughness: 0.55,
    metalness: 0.0,
    clearcoat: 0.2,
    clearcoatRoughness: 0.7,
    sheen: 0.35,
    sheenColor: new THREE.Color('#ffd0b0'),
    sheenRoughness: 0.6,
    ior: 1.4,
    roughnessMap: skinTextures.roughness,
    normalMap: skinTextures.normal,
    normalScale: new THREE.Vector2(0.35, 0.35),
    map: skinTextures.color,
  });

  const groundGeo = new THREE.CircleGeometry(8, 64);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f0f12, roughness: 0.9, metalness: 0.1 });
  ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1.6;
  ground.receiveShadow = true;
  scene.add(ground);

  bodyGroup = new THREE.Group();
  scene.add(bodyGroup);

  buildBodyPart(currentPart);
  wireUI();
  document.getElementById('loading').classList.add('hidden');

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  controls.addEventListener('end', () => { if (tattooImage) applyTattoo(); });

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}

if (sessionStorage.getItem('tattooHubUnlocked') === '1') setTimeout(initScene, 0);

/* ============================================================
   PROCEDURAL SKIN TEXTURES
   ============================================================ */
function buildSkinTextures() {
  const size = 512;
  const colorCanvas = document.createElement('canvas');
  colorCanvas.width = colorCanvas.height = size;
  const cctx = colorCanvas.getContext('2d');
  cctx.fillStyle = '#ffffff';
  cctx.fillRect(0, 0, size, size);

  // Fine noise for pores / mottling
  const img = cctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() * 0.5 + 0.5) * 255;
    d[i] = d[i + 1] = d[i + 2] = n;
  }
  cctx.putImageData(img, 0, 0);

  // Blur slightly for soft mottling
  cctx.filter = 'blur(1.2px)';
  cctx.drawImage(colorCanvas, 0, 0);
  cctx.filter = 'none';

  // Add subtle veins / redness patches
  cctx.globalAlpha = 0.08;
  for (let i = 0; i < 25; i++) {
    cctx.beginPath();
    cctx.fillStyle = `hsl(${10 + Math.random() * 20}, 60%, ${60 + Math.random() * 20}%)`;
    cctx.ellipse(Math.random() * size, Math.random() * size, 20 + Math.random() * 60, 10 + Math.random() * 30, Math.random() * Math.PI, 0, Math.PI * 2);
    cctx.fill();
  }
  cctx.globalAlpha = 1;

  const colorTex = new THREE.CanvasTexture(colorCanvas);
  colorTex.colorSpace = THREE.SRGBColorSpace;
  colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;

  // Roughness map — different noise
  const roughCanvas = document.createElement('canvas');
  roughCanvas.width = roughCanvas.height = size;
  const rctx = roughCanvas.getContext('2d');
  const rimg = rctx.createImageData(size, size);
  for (let i = 0; i < rimg.data.length; i += 4) {
    const n = 130 + Math.random() * 60;
    rimg.data[i] = rimg.data[i + 1] = rimg.data[i + 2] = n;
    rimg.data[i + 3] = 255;
  }
  rctx.putImageData(rimg, 0, 0);
  const roughTex = new THREE.CanvasTexture(roughCanvas);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;

  // Normal map — from bumpy noise
  const normCanvas = document.createElement('canvas');
  normCanvas.width = normCanvas.height = size;
  const nctx = normCanvas.getContext('2d');
  const nimg = nctx.createImageData(size, size);
  for (let i = 0; i < nimg.data.length; i += 4) {
    nimg.data[i] = 128 + (Math.random() - 0.5) * 30;
    nimg.data[i + 1] = 128 + (Math.random() - 0.5) * 30;
    nimg.data[i + 2] = 255;
    nimg.data[i + 3] = 255;
  }
  nctx.putImageData(nimg, 0, 0);
  const normTex = new THREE.CanvasTexture(normCanvas);
  normTex.wrapS = normTex.wrapT = THREE.RepeatWrapping;

  return { color: colorTex, roughness: roughTex, normal: normTex };
}

/* ============================================================
   ANATOMY BUILDERS
   ============================================================ */

function disposeGroup(g) {
  if (!g) return;
  while (g.children.length) {
    const c = g.children.pop();
    c.geometry?.dispose();
  }
}
function clearTattoos() {
  tattooDecals.forEach(d => { bodyGroup.remove(d); d.geometry.dispose(); d.material.dispose(); });
  tattooDecals = [];
}

/**
 * Build a limb as a lathe-like mesh from a profile of control points.
 * profile: [{ y, r, sx=1, sz=1 }] from bottom to top.
 */
function buildLimb({ profile, segments = 120, radialSegments = 96, centerY = 0 }) {
  const positions = [];
  const uvs = [];
  const indices = [];

  // Sample smoothly
  const samples = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const f = t * (profile.length - 1);
    const i0 = Math.floor(f);
    const i1 = Math.min(i0 + 1, profile.length - 1);
    const lt = f - i0;
    const p0 = profile[i0], p1 = profile[i1];
    // Catmull-Rom-ish smoothing
    const sm = lt * lt * (3 - 2 * lt);
    const y  = p0.y  + (p1.y  - p0.y ) * lt;
    const r  = p0.r  + (p1.r  - p0.r ) * sm;
    const sx = (p0.sx ?? 1) + ((p1.sx ?? 1) - (p0.sx ?? 1)) * lt;
    const sz = (p0.sz ?? 1) + ((p1.sz ?? 1) - (p0.sz ?? 1)) * lt;
    samples.push({ y: y - centerY, r, sx, sz });
  }

  for (let i = 0; i <= segments; i++) {
    const s = samples[i];
    const v = i / segments;
    for (let j = 0; j <= radialSegments; j++) {
      const u = j / radialSegments;
      const theta = u * Math.PI * 2;
      const x = Math.cos(theta) * s.r * s.sx;
      const z = Math.sin(theta) * s.r * s.sz;
      positions.push(x, s.y, z);
      uvs.push(u * 2, v * 3);
    }
  }
  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * (radialSegments + 1) + j;
      const b = a + radialSegments + 1;
      indices.push(a, b, a + 1);
      indices.push(b, b + 1, a + 1);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

/**
 * Hand — palm + 5 fingers, angled naturally.
 * Placed so it attaches to a wrist at y=0, extends downward.
 */
function buildHand({ flip = false } = {}) {
  const group = new THREE.Group();

  // Palm: an ellipsoid-ish box made from a scaled sphere
  const palmGeo = new THREE.SphereGeometry(1, 32, 24);
  const palmMesh = new THREE.Mesh(palmGeo, skinMaterial);
  palmMesh.scale.set(0.16, 0.10, 0.055);
  palmMesh.position.y = -0.09;
  palmMesh.castShadow = true;
  palmMesh.receiveShadow = true;
  group.add(palmMesh);

  // Wrist connector
  const wristGeo = new THREE.CylinderGeometry(0.075, 0.09, 0.08, 24, 8, false);
  const wristMesh = new THREE.Mesh(wristGeo, skinMaterial);
  wristMesh.position.y = 0.02;
  wristMesh.scale.z = 0.7;
  wristMesh.castShadow = true;
  group.add(wristMesh);

  // Fingers — 4 fingers + thumb
  const fingerData = [
    { x: -0.10, len: 0.16, r: 0.026, spread: -0.05 }, // index
    { x: -0.035, len: 0.18, r: 0.027, spread: -0.015 }, // middle
    { x: 0.035, len: 0.165, r: 0.026, spread: 0.02 }, // ring
    { x: 0.10, len: 0.13, r: 0.023, spread: 0.06 }, // pinky
  ];
  fingerData.forEach(f => {
    const fingerGroup = new THREE.Group();
    // 3 segments per finger
    let cy = 0;
    const segLens = [f.len * 0.42, f.len * 0.33, f.len * 0.25];
    const radii = [f.r, f.r * 0.9, f.r * 0.8, f.r * 0.7];
    segLens.forEach((sl, si) => {
      const g = new THREE.CylinderGeometry(radii[si + 1], radii[si], sl, 16, 4, false);
      const m = new THREE.Mesh(g, skinMaterial);
      m.position.y = cy - sl / 2;
      m.castShadow = true;
      fingerGroup.add(m);
      // knuckle
      if (si < 2) {
        const knuckleGeo = new THREE.SphereGeometry(radii[si + 1], 16, 12);
        const km = new THREE.Mesh(knuckleGeo, skinMaterial);
        km.position.y = cy - sl;
        km.castShadow = true;
        fingerGroup.add(km);
      }
      cy -= sl;
    });
    // nail tip
    const tipGeo = new THREE.SphereGeometry(radii[3], 12, 8);
    const tip = new THREE.Mesh(tipGeo, skinMaterial);
    tip.position.y = cy;
    fingerGroup.add(tip);

    fingerGroup.position.set(f.x, -0.16, 0);
    fingerGroup.rotation.z = f.spread;
    fingerGroup.rotation.x = 0.1;
    group.add(fingerGroup);
  });

  // Thumb
  const thumbGroup = new THREE.Group();
  {
    const segLens = [0.06, 0.05, 0.05];
    const radii = [0.032, 0.028, 0.024, 0.02];
    let cy = 0;
    segLens.forEach((sl, si) => {
      const g = new THREE.CylinderGeometry(radii[si + 1], radii[si], sl, 16, 4, false);
      const m = new THREE.Mesh(g, skinMaterial);
      m.position.y = cy - sl / 2;
      m.castShadow = true;
      thumbGroup.add(m);
      cy -= sl;
    });
    thumbGroup.position.set(-0.16, -0.14, 0.02);
    thumbGroup.rotation.z = 0.6;
    thumbGroup.rotation.x = 0.3;
  }
  group.add(thumbGroup);

  if (flip) group.rotation.y = Math.PI;

  return group;
}

/**
 * Foot — shaped like a real foot, with toes.
 * Attaches to ankle at y=0.
 */
function buildFoot({ flip = false } = {}) {
  const group = new THREE.Group();

  // Ankle
  const ankleGeo = new THREE.CylinderGeometry(0.075, 0.09, 0.12, 24, 8, false);
  const ankle = new THREE.Mesh(ankleGeo, skinMaterial);
  ankle.position.y = -0.02;
  ankle.castShadow = true;
  group.add(ankle);

  // Main foot body — elongated ellipsoid tapering forward
  const footGeo = new THREE.SphereGeometry(1, 40, 28);
  const foot = new THREE.Mesh(footGeo, skinMaterial);
  foot.scale.set(0.13, 0.055, 0.22);
  foot.position.set(0, -0.14, 0.06);
  foot.castShadow = true;
  group.add(foot);

  // Heel bump
  const heelGeo = new THREE.SphereGeometry(1, 24, 16);
  const heel = new THREE.Mesh(heelGeo, skinMaterial);
  heel.scale.set(0.09, 0.07, 0.09);
  heel.position.set(0, -0.15, -0.08);
  heel.castShadow = true;
  group.add(heel);

  // Toes — 5 small rounded shapes
  const toeData = [
    { x: -0.10, len: 0.045, r: 0.028, z: 0.24 },
    { x: -0.05, len: 0.040, r: 0.025, z: 0.26 },
    { x: 0.0,   len: 0.036, r: 0.023, z: 0.27 },
    { x: 0.05,  len: 0.032, r: 0.021, z: 0.26 },
    { x: 0.095, len: 0.028, r: 0.019, z: 0.245 },
  ];
  toeData.forEach(t => {
    const tGeo = new THREE.SphereGeometry(t.r, 16, 12);
    const tm = new THREE.Mesh(tGeo, skinMaterial);
    tm.scale.z = t.len / t.r;
    tm.position.set(t.x, -0.14, t.z);
    tm.castShadow = true;
    group.add(tm);
  });

  if (flip) group.rotation.y = Math.PI;

  return group;
}

/* ============================================================
   BODY PART ASSEMBLY
   ============================================================ */
function buildBodyPart(part) {
  currentPart = part;
  clearTattoos();
  disposeGroup(bodyGroup);
  bodyGroup.clear();

  let limbMesh = null;
  const extras = [];

  switch (part) {
    case 'fullArm': {
      // Shoulder → upper arm (bicep) → elbow → forearm → wrist → hand
      const geo = buildLimb({
        profile: [
          { y: -2.35, r: 0.085, sx: 1.05, sz: 0.75 }, // wrist (flat)
          { y: -2.20, r: 0.105, sx: 1.05, sz: 0.82 },
          { y: -1.90, r: 0.145, sx: 1.0, sz: 0.88 },
          { y: -1.55, r: 0.185, sx: 1.0, sz: 0.92 }, // forearm muscle
          { y: -1.20, r: 0.205, sx: 1.0, sz: 0.95 },
          { y: -0.95, r: 0.185, sx: 1.0, sz: 0.95 }, // elbow narrow
          { y: -0.85, r: 0.195, sx: 1.0, sz: 0.98 }, // elbow
          { y: -0.50, r: 0.235, sx: 1.0, sz: 1.0 },  // lower bicep
          { y: -0.10, r: 0.285, sx: 1.0, sz: 1.02 }, // bicep peak
          { y:  0.25, r: 0.280, sx: 1.05, sz: 1.0 }, // upper bicep
          { y:  0.55, r: 0.290, sx: 1.15, sz: 0.98 },// deltoid
          { y:  0.75, r: 0.310, sx: 1.25, sz: 0.95 },// shoulder cap
          { y:  0.85, r: 0.280, sx: 1.3, sz: 0.9 },  // shoulder top
        ],
        segments: 160,
        radialSegments: 96,
        centerY: -0.6,
      });
      limbMesh = new THREE.Mesh(geo, skinMaterial);
      // Attach hand at wrist
      const hand = buildHand();
      hand.position.y = -1.75; // wrist position after centerY shift
      hand.scale.setScalar(1.1);
      extras.push(hand);
      break;
    }

    case 'upperArm': {
      const geo = buildLimb({
        profile: [
          { y: -0.95, r: 0.19, sx: 1.0, sz: 0.95 },
          { y: -0.60, r: 0.22, sx: 1.0, sz: 0.98 },
          { y: -0.15, r: 0.285, sx: 1.0, sz: 1.0 },
          { y:  0.25, r: 0.300, sx: 1.05, sz: 1.0 },
          { y:  0.55, r: 0.290, sx: 1.15, sz: 0.98 },
          { y:  0.75, r: 0.310, sx: 1.25, sz: 0.95 },
          { y:  0.90, r: 0.285, sx: 1.3, sz: 0.9 },
        ],
        segments: 120,
        radialSegments: 80,
      });
      limbMesh = new THREE.Mesh(geo, skinMaterial);
      break;
    }

    case 'forearmHand': {
      const geo = buildLimb({
        profile: [
          { y: -1.55, r: 0.085, sx: 1.05, sz: 0.78 },
          { y: -1.35, r: 0.105, sx: 1.05, sz: 0.82 },
          { y: -1.05, r: 0.145, sx: 1.0, sz: 0.88 },
          { y: -0.70, r: 0.185, sx: 1.0, sz: 0.92 },
          { y: -0.35, r: 0.210, sx: 1.0, sz: 0.95 },
          { y:  0.10, r: 0.195, sx: 1.0, sz: 0.98 },
          { y:  0.55, r: 0.175, sx: 1.0, sz: 1.0 },
          { y:  0.90, r: 0.150, sx: 1.0, sz: 1.0 },
        ],
        segments: 120,
        radialSegments: 80,
        centerY: -0.3,
      });
      limbMesh = new THREE.Mesh(geo, skinMaterial);
      const hand = buildHand();
      hand.position.y = -1.30;
      hand.scale.setScalar(1.05);
      extras.push(hand);
      break;
    }

    case 'fullLeg': {
      const geo = buildLimb({
        profile: [
          { y: -2.55, r: 0.13, sx: 1.1, sz: 0.85 },  // ankle
          { y: -2.35, r: 0.155, sx: 1.05, sz: 0.88 },
          { y: -2.00, r: 0.22, sx: 1.0, sz: 0.92 },
          { y: -1.65, r: 0.31, sx: 1.0, sz: 0.97 },  // calf peak
          { y: -1.30, r: 0.33, sx: 1.0, sz: 1.0 },
          { y: -1.00, r: 0.30, sx: 1.0, sz: 1.0 },
          { y: -0.75, r: 0.26, sx: 1.0, sz: 1.0 },   // knee
          { y: -0.55, r: 0.30, sx: 1.0, sz: 1.0 },
          { y: -0.15, r: 0.38, sx: 1.0, sz: 1.0 },
          { y:  0.25, r: 0.44, sx: 1.0, sz: 1.0 },   // thigh mid
          { y:  0.65, r: 0.47, sx: 1.0, sz: 1.0 },
          { y:  1.00, r: 0.48, sx: 1.0, sz: 1.0 },   // upper thigh
          { y:  1.20, r: 0.45, sx: 1.0, sz: 1.0 },
        ],
        segments: 180,
        radialSegments: 96,
        centerY: -0.6,
      });
      limbMesh = new THREE.Mesh(geo, skinMaterial);
      const foot = buildFoot();
      foot.position.y = -1.95;
      foot.scale.setScalar(1.05);
      extras.push(foot);
      break;
    }

    case 'calf': {
      const geo = buildLimb({
        profile: [
          { y: -1.15, r: 0.13, sx: 1.1, sz: 0.85 },
          { y: -0.95, r: 0.16, sx: 1.05, sz: 0.9 },
          { y: -0.60, r: 0.22, sx: 1.0, sz: 0.94 },
          { y: -0.25, r: 0.30, sx: 1.0, sz: 0.97 },
          { y:  0.10, r: 0.34, sx: 1.0, sz: 1.0 },
          { y:  0.45, r: 0.33, sx: 1.0, sz: 1.0 },
          { y:  0.75, r: 0.28, sx: 1.0, sz: 1.0 },
          { y:  1.00, r: 0.25, sx: 1.0, sz: 1.0 },
        ],
        segments: 140,
        radialSegments: 80,
      });
      limbMesh = new THREE.Mesh(geo, skinMaterial);
      const foot = buildFoot();
      foot.position.y = -1.12;
      extras.push(foot);
      break;
    }

    case 'torso': {
      const geo = buildLimb({
        profile: [
          { y: -1.15, r: 0.55, sx: 1.0, sz: 0.65 },
          { y: -0.85, r: 0.52, sx: 1.0, sz: 0.65 },
          { y: -0.45, r: 0.47, sx: 1.0, sz: 0.62 },
          { y: -0.05, r: 0.52, sx: 1.0, sz: 0.62 },
          { y:  0.35, r: 0.60, sx: 1.05, sz: 0.68 },
          { y:  0.65, r: 0.65, sx: 1.15, sz: 0.70 },
          { y:  0.90, r: 0.68, sx: 1.25, sz: 0.65 },
          { y:  1.10, r: 0.60, sx: 1.20, sz: 0.60 },
        ],
        segments: 140,
        radialSegments: 96,
      });
      limbMesh = new THREE.Mesh(geo, skinMaterial);
      break;
    }
  }

  if (limbMesh) {
    limbMesh.castShadow = true;
    limbMesh.receiveShadow = true;
    bodyGroup.add(limbMesh);
  }
  extras.forEach(e => {
    e.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; c.material = skinMaterial; } });
    bodyGroup.add(e);
  });

  // Fit camera
  const box = new THREE.Box3().setFromObject(bodyGroup);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.6;
  controls.target.copy(center);
  camera.position.set(center.x + radius * 1.4, center.y + radius * 0.3, center.z + radius * 3.0);
  controls.minDistance = radius * 1.0;
  controls.maxDistance = radius * 8;
  controls.update();

  // Ground under part
  ground.position.y = box.min.y - 0.05;
}

/* ============================================================
   TATTOO DECAL
   ============================================================ */
function applyTattoo() {
  if (!bodyGroup || !tattooImage) return;
  clearTattoos();

  // Raycast from camera toward body center to find nearest hit point
  const raycaster = new THREE.Raycaster();
  const center = new THREE.Vector3();
  new THREE.Box3().setFromObject(bodyGroup).getCenter(center);
  const dir = new THREE.Vector3().subVectors(center, camera.position).normalize();
  raycaster.set(camera.position, dir);

  const meshes = [];
  bodyGroup.traverse(c => { if (c.isMesh) meshes.push(c); });
  const hits = raycaster.intersectObjects(meshes, false);

  let hitMesh, hitPoint, hitNormal;
  if (hits.length) {
    hitMesh = hits[0].object;
    hitPoint = hits[0].point.clone();
    hitNormal = hits[0].face.normal.clone()
      .applyMatrix3(new THREE.Matrix3().getNormalMatrix(hitMesh.matrixWorld)).normalize();
  } else {
    // Fallback: project from camera onto center
    hitMesh = meshes[0];
    hitPoint = center.clone();
    hitNormal = new THREE.Vector3().subVectors(camera.position, center).normalize();
  }

  const camDir = new THREE.Vector3().subVectors(camera.position, hitPoint).normalize();
  const up = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(up, camDir).normalize();
  const newUp = new THREE.Vector3().crossVectors(camDir, right).normalize();
  const orientation = new THREE.Matrix4().makeBasis(right, newUp, camDir.clone().negate());

  const rotZ = new THREE.Matrix4().makeRotationZ(THREE.MathUtils.degToRad(currentParams.rotation));
  orientation.multiply(rotZ);
  if (currentParams.flipH) orientation.multiply(new THREE.Matrix4().makeScale(-1, 1, 1));

  // Local-space projection: transform hitPoint and orientation into hitMesh local space
  const inv = new THREE.Matrix4().copy(hitMesh.matrixWorld).invert();
  const localPos = hitPoint.clone().applyMatrix4(inv);
  const localOrient = orientation.clone().premultiply(new THREE.Matrix4().extractRotation(inv));
  const localCamDir = camDir.clone().transformDirection(inv);

  // Push slightly outward along normal for clean projection
  localPos.add(localCamDir.clone().multiplyScalar(-0.001));

  const size = new THREE.Vector3(
    0.55 * currentParams.scale,
    0.55 * currentParams.scale,
    0.55 * currentParams.scale
  );

  let decalGeo;
  try {
    decalGeo = new DecalGeometry(hitMesh, localPos, localOrient, size);
  } catch (e) { return; }

  // If decal came back empty, bail
  if (!decalGeo.attributes.position || decalGeo.attributes.position.count === 0) return;

  const tex = new THREE.Texture(tattooImage);
  tex.needsUpdate = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;

  const decalMat = new THREE.MeshStandardMaterial({
    map: tex,
    transparent: true,
    opacity: currentParams.opacity,
    depthTest: true,
    depthWrite: false,
    polygonOffset: true,
    polygonOffsetFactor: -4,
    roughness: 0.7,
    metalness: 0.0,
  });

  const decal = new THREE.Mesh(decalGeo, decalMat);
  decal.renderOrder = 2;
  hitMesh.add(decal); // parent to mesh so it moves with it
  tattooDecals.push(decal);
}

/* ============================================================
   UI WIRING
   ============================================================ */
function wireUI() {
  const $ = (id) => document.getElementById(id);

  document.querySelectorAll('#bodyParts .btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#bodyParts .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildBodyPart(btn.dataset.part);
      if (tattooImage) setTimeout(applyTattoo, 80);
    });
  });

  $('skinColor').addEventListener('input', (e) => {
    skinMaterial.color.set(e.target.value);
  });

  $('lightIntensity').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    $('lightVal').textContent = v.toFixed(2);
    keyLight.intensity = 2.0 * v;
    hemi.intensity = 0.5 * v;
  });

  $('skinDetail').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    $('skinDetailVal').textContent = v.toFixed(2);
    if (skinMaterial.normalMap) {
      skinMaterial.normalScale.set(v * 0.5, v * 0.5);
    }
    if (skinMaterial.map) {
      skinMaterial.map.repeat.set(3 + v * 3, 4 + v * 4);
      skinMaterial.map.needsUpdate = true;
    }
    if (skinMaterial.roughnessMap) {
      skinMaterial.roughnessMap.repeat.set(3 + v * 3, 4 + v * 4);
      skinMaterial.roughnessMap.needsUpdate = true;
    }
    skinMaterial.needsUpdate = true;
  });

  const drop = $('drop');
  const fileInput = $('fileInput');
  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  $('tScale').addEventListener('input', (e) => {
    currentParams.scale = parseFloat(e.target.value);
    $('tScaleVal').textContent = currentParams.scale.toFixed(2);
    applyTattoo();
  });
  $('tRot').addEventListener('input', (e) => {
    currentParams.rotation = parseFloat(e.target.value);
    $('tRotVal').textContent = currentParams.rotation + '°';
    applyTattoo();
  });
  $('tOpacity').addEventListener('input', (e) => {
    currentParams.opacity = parseFloat(e.target.value);
    $('tOpacityVal').textContent = currentParams.opacity.toFixed(2);
    tattooDecals.forEach(d => d.material.opacity = currentParams.opacity);
  });
  $('flipH').addEventListener('click', () => {
    currentParams.flipH = !currentParams.flipH;
    applyTattoo();
  });
  $('removeTattoo').addEventListener('click', () => {
    clearTattoos();
    tattooImage = null;
    $('tattooControls').style.display = 'none';
    fileInput.value = '';
    toast('Tattoo removed');
  });

  $('resetView').addEventListener('click', () => {
    if (!bodyGroup) return;
    const box = new THREE.Box3().setFromObject(bodyGroup);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z) * 0.6;
    controls.target.copy(center);
    camera.position.set(center.x + radius * 1.4, center.y + radius * 0.3, center.z + radius * 3.0);
    controls.update();
  });

  $('snapshot').addEventListener('click', () => {
    renderer.render(scene, camera);
    const url = renderer.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tattoo-hub-' + Date.now() + '.png';
    a.click();
    toast('Snapshot saved');
  });
}

function handleFile(file) {
  if (!file.type.startsWith('image/')) { toast('Please upload an image file'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      tattooImage = img;
      document.getElementById('tattooControls').style.display = 'block';
      applyTattoo();
      toast('Tattoo loaded — adjust on the left');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
